  <body>
    <div id="root"><!--prerender:body--></div>
    <noscript>
      <p style="font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif;max-width:640px;margin:24px auto;padding:0 16px">
        Apartments4Newark works best with JavaScript turned on. You can also reach us on WhatsApp or by text at
        <a href="tel:+18626000056">(862) 600-0056</a>.
      </p>
    </noscript>
    <!-- Netlify Forms: these hidden forms let Netlify detect the fields it
         should accept and email you. The real forms post to them from React. -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="company" hidden>
      <input name="name" /><input name="phone" /><input name="city" /><input name="zip" /><textarea name="message"></textarea>
      <input name="property_title" /><input name="property_id" /><input name="listing" /><input name="lang" /><input name="status" /><input name="company" />
    </form>
    <form name="alert" data-netlify="true" netlify-honeypot="company" hidden>
      <input name="phone" /><input name="city" /><input name="rent_type" /><input name="max_rent" /><input name="lang" /><input name="active" /><input name="company" />
    </form>
    <form name="listing" data-netlify="true" netlify-honeypot="company" hidden>
      <input name="contact_name" /><input name="contact_phone" /><input name="contact_email" /><input name="city" /><input name="rent" />
      <input name="type" /><input name="address" /><input name="photos" /><input name="company" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
