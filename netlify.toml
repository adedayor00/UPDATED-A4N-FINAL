# Netlify build settings for apartments4newark.com.
# Supabase keys go in Netlify → Site configuration → Environment variables
# (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY). See SETUP.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_NETLIFY_FORMS = "true"

# Pre-built pages (/, city pages, each listing) are served as real files.
# Anything else falls back to the app, which shows the right page or a 404.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
